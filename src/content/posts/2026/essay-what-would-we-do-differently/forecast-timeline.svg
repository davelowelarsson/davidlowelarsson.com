<svg xmlns="http://www.w3.org/2000/svg" width="600" height="446" viewBox="0 0 600 446" role="img" aria-labelledby="title desc">
  <title id="title">Fourteen weeks of actual stream starts and retrospective forecasts</title>
  <desc id="desc">Real daily measurements and seven-day ensemble forecasts share one index: the first week's average actuals equals 100. Values are rounded to five index points. Relative weeks replace calendar dates and no viewing volumes are included. The shaded calibrated P10-P90 forecast range is intended to contain 80 percent of results, not a guarantee. Both series follow the rise and weekly dips, with some actuals outside the range. These are exploratory hindsight forecasts, not live validation.</desc>
