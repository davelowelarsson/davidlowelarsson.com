    text { font-family: Verdana, sans-serif; fill: #25282c; }
    .muted { fill: #5b6268; }
    .grid { stroke: #dce0e2; stroke-width: 1; }
    .actual { fill: none; stroke: #25282c; stroke-width: 2; }
    .forecast { fill: none; stroke: #25765b; stroke-width: 2; }
  </style>
  <rect width="600" height="446" fill="#fafbfc" />
  <text x="32" y="48" font-size="28" font-weight="700">We could follow the total</text>
  <text class="muted" x="32" y="80" font-size="20">14 weeks, indexed. No volumes or dates.</text>
